
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Review | Grand Stay</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f5;
            color: #26352c;
        }

        nav {
            background: #123c2b;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: #e7c66b;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            max-width: 600px;
            margin: 55px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #123c2b;
            text-align: center;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            background: #123c2b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #28583f;
        }

        .note {
            font-size: 13px;
            color: #777;
            margin-top: 12px;
            text-align: center;
        }

        @media(max-width: 650px) {
            .container {
                margin: 25px 15px;
                padding: 25px;
            }

            nav {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<nav>
    <h2>Grand Stay</h2>
    <div>
        <a href="/">Home</a>
        <a href="/rooms">Rooms</a>
    </div>
</nav>

<div class="container">

    <h1>Share Your Experience</h1>

    <p class="subtitle">
        Thank you for staying with Grand Stay!
        We would love to hear your feedback.
    </p>

    <form method="POST" action="{{ url_for('submit_review') }}">

        <label for="booking_id">Booking ID</label>
        <input
            type="number"
            id="booking_id"
            name="booking_id"
            min="1"
            required
            placeholder="Enter your booking ID">

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Enter your booking email">

        <label for="rating">Your Rating</label>
        <select id="rating" name="rating" required>
            <option value="">Select your rating</option>
            <option value="5">★★★★★ - Excellent</option>
            <option value="4">★★★★ - Very Good</option>
            <option value="3">★★★ - Good</option>
            <option value="2">★★ - Fair</option>
            <option value="1">★ - Poor</option>
        </select>

        <label for="feedback">Your Feedback</label>
        <textarea
            id="feedback"
            name="feedback"
            maxlength="1000"
            required
            placeholder="Tell us about your experience..."></textarea>

        <button type="submit">Submit Review</button>

        <p class="note">
            Only eligible completed bookings can submit a review.
        </p>

    </form>

</div>

</body>
</html>
