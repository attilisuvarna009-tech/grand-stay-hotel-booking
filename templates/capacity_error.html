
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guest Limit Exceeded - Grand Stay</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html {
            min-height: 100%;
            background-color: #101b2b;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;

            background-color: #101b2b;
            background-image:
                linear-gradient(
                    rgba(5, 15, 30, 0.72),
                    rgba(5, 15, 30, 0.78)
                ),
                url("https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=2000&q=85");

            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container {
            background: rgba(255, 255, 255, 0.97);
            width: 90%;
            max-width: 550px;
            padding: 45px 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .brand {
            color: #d4af69;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .icon {
            width: 75px;
            height: 75px;
            background: #fff1f1;
            color: #d9534f;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        h1 {
            color: #1f3d35;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .room {
            font-weight: bold;
            color: #222;
        }

        .limit {
            font-weight: bold;
            color: #b8860b;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 13px 24px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .booking-btn {
            background: #1f3d35;
            color: white;
        }

        .booking-btn:hover {
            background: #d4af69;
            color: #101b2b;
        }

        .rooms-btn {
            background: #e9e2d5;
            color: #222;
        }

        .rooms-btn:hover {
            background: #d4af69;
            color: #101b2b;
        }

        @media (max-width: 500px) {
            .container {
                padding: 35px 22px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 15px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="brand">
            Grand Stay
        </div>

        <div class="icon">
            !
        </div>

        <h1>Guest Limit Exceeded</h1>

        <p>
            The selected room cannot accommodate this many guests.
        </p>

        <p>
            <span class="room">{{ room_type }}</span>
            allows a maximum of
            <span class="limit">{{ capacity }} guests</span>.
        </p>

        <div class="buttons">

            <a href="/booking" class="btn booking-btn">
                Back to Booking
            </a>

            <a href="/rooms" class="btn rooms-btn">
                View Rooms
            </a>

        </div>

    </div>

</body>

</html>
