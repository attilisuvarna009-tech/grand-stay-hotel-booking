<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cancel Booking - Grand Stay</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            color: #222;
        }

        nav {
            background: #1f3d35;
            padding: 18px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 60px auto;
        }

        .cancel-box {
            background: white;
            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        h1 {
            color: #c0392b;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #c0392b;
        }

        .cancel-btn {
            width: 100%;

            padding: 13px;

            background: #c0392b;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;

            cursor: pointer;
        }

        .cancel-btn:hover {
            background: #a93226;
        }

        .back-link {
            display: inline-block;

            margin-top: 20px;

            color: #1f3d35;

            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .warning {
            background: #fff3cd;
            color: #856404;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <nav>

        <h2>Grand Stay</h2>

        <div>

            <a href="/">Home</a>

            <a href="/rooms">Rooms</a>

            <a href="/booking">Book Now</a>

        </div>

    </nav>


    <!-- Cancellation Form -->

    <div class="container">

        <div class="cancel-box">

            <h1>Cancel Booking</h1>

            <p class="subtitle">
                Enter your booking ID to cancel your reservation.
            </p>


            <div class="warning">

                ⚠️ Please make sure you enter the correct
                booking ID before cancelling.

            </div>


            <form
                method="POST"
                action="/cancel_booking"
                onsubmit="return confirm('Are you sure you want to cancel this booking?');"
            >

                <div class="input-group">

                    <label for="booking_id">
                        Booking ID
                    </label>

                    <input
                        type="number"
                        id="booking_id"
                        name="booking_id"
                        placeholder="Enter booking ID"
                        min="1"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="cancel-btn"
                >
                    Cancel Booking
                </button>

            </form>


            <a href="/" class="back-link">
                ← Back to Home
            </a>

        </div>

    </div>


    <footer>

        © 2026 Grand Stay. All Rights Reserved.

    </footer>


</body>

</html>
